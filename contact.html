        <form action="">
            <h1>Contact Us</h1>
            <hr>
            <div>
                <label for="firstname"><strong>Firstname:</strong></label><br>
                <input type="firstname" placeholder="Enter your firstname"><br>

            </div>
            <div>

                <label for="text"><strong>Reason for contacting us:</strong></label><br>
                <textarea name="write your reason" id="" placeholder="Write your reason"></textarea><br>
            </div>

            <input type="submit" value="submit">
            <input type="reset" value="reset"><br>
